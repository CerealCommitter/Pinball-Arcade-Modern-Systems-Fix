; Pinball Arcade - Modern Systems Fix settings.
; Optional: the launch window writes this file for you. Every key can be left out.
; Comments must be on their own line.

[Launcher]
; 1 = show the settings window every time the game starts, 0 = start straight away
; (hold Shift while the game starts to bring the window back)
ShowAtLaunch=1
; DX11 or DX9. If Steam starts the other one, the fix switches to this one.
Renderer=DX11

[Display]
; Fullscreen = borderless fullscreen, 16:9 picture centred with black bars
; Windowed   = normal window, 16:9 at 75% of the fullscreen size, centred
; Off        = leave the game's own window handling alone
Mode=Fullscreen
; Picture shape for both modes, e.g. 16:9 (default), 16:10 or 4:3
AspectRatio=16:9

[Speed]
; DX11 frame cap the table physics are tuned for. Leave at 60; 0 turns the cap off
; (the game then runs too fast on high-refresh monitors).
FrameRateCap=60
; Timer (default) or Refresh (present every Nth monitor refresh; less even in testing)
Pacing=Timer
